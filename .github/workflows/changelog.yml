name: Changelog

# Fails a pull request that changes what a release ships (the crate's sources and manifests,
# browser scripts, bundled data, the vendored hyper, the agent skill, the MCP bundle manifest,
# the help and MCP fixtures compiled into the binaries, and the LICENSE and NOTICE in every
# archive) without adding a line to CHANGELOG.md. Add the line under '## Unreleased', or
# apply the skip-changelog label to a change users cannot see. Dependabot pull requests are
# skipped.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changelog line for shipped changes
        uses: yungSNAT/yungSNAT/.github/actions/changelog-line@5cd2765e4c78098b7602809e60830f07373fae44 # v1
        with:
          shipped: '^(src/|build\.rs$|Cargo\.(toml|lock)$|browser-scripts/|data/|vendor/|skills/|packaging/mcpb/|fixtures/(cli-help\.txt|cli-debug-help\.txt|mcp-initialize\.json|mcp-tools\.json|mcp-resources\.json)$|LICENSE$|NOTICE$)'
          exclude: '_tests\.rs$'
          heading: "'## Unreleased'"
