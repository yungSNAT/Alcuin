name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tests run real completions; they must never deliver desktop notifications.
  ORACLE_DISABLE_NOTIFICATIONS: "1"

jobs:
  # A change only to Markdown at the root, docs/ or .github/assets/ skips the Windows shards'
  # steps and native-chrome; the Linux leg still runs every test. No test or lint reads those
  # files except README.md, which tests/docs_contracts.rs reads the same way on every platform.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request is checked out as its merge commit, whose first parent is main. Any
      # other event, or a range git cannot diff, counts as a code change.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          # --no-renames lists a moved file's old path too, so moving code into docs/ is code.
          docs=false
          if [ -n "$base" ] && files=$(git diff --no-renames --name-only "$base" HEAD) && [ -n "$files" ]; then
            docs=true
            while IFS= read -r file; do
              [[ $file == docs/* || $file == .github/assets/* || ($file != */* && $file == *.md) ]] || docs=false
            done <<< "$files"
          fi
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"

  # Offline checks only. Tests that need a signed-in browser or a live provider are
  # #[ignore]d and run locally; live receipts never run in CI. The native-Chrome job
  # below runs the privacy and Grok fixture test, which needs only an installed Chrome.
  check:
    name: check (${{ matrix.os }}${{ matrix.shard && format(', {0}/2', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # Linux on Arm, for the aarch64 release build; no coverage, so it runs plain cargo test.
          - os: ubuntu-24.04-arm
          # macOS on Apple silicon, for the macOS release build.
          - os: macos-latest
          # Windows runs its tests one at a time, so they are split across 2 runners by test
          # name; the serial run took 11.5 of the job's 13.2 minutes.
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
    # Unless changes succeeds, every leg runs in full.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The shards keep their required checks by starting and skipping each step, rather than
      # by a job-level condition on the matrix.
      SKIP: ${{ matrix.os == 'windows-latest' && needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'true' }}
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.SKIP != 'true'
        run: rustup toolchain install
      - name: Check browser script syntax
        if: env.SKIP != 'true'
        shell: bash
        run: for script in browser-scripts/*.js; do node --check "$script"; done
      # Only main saves: a pull request's cache can be restored only by that pull request's
      # reruns, and its copies pushed the repository over the 10 GB cache limit.
      - if: env.SKIP != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Real-time scanning can hold newly written files, so atomic renames retry past the tests'
      # durable-write budgets. The runner is disposable.
      - if: runner.os == 'Windows' && env.SKIP != 'true'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - if: matrix.shard != 2 && env.SKIP != 'true'
        run: cargo fmt --check && cargo fmt --check --manifest-path packaging/smoke/Cargo.toml
      - if: matrix.shard != 2 && env.SKIP != 'true'
        run: cargo clippy --all-targets --locked -- -D warnings && cargo clippy --all-targets --locked --manifest-path packaging/smoke/Cargo.toml -- -D warnings
      # The release smoke test's own test needs a Unix shell.
      - if: runner.os != 'Windows'
        run: cargo test --locked --manifest-path packaging/smoke/Cargo.toml
      # Coverage needs llvm-tools and a prebuilt cargo-llvm-cov, with no fallback to compiling it.
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: rustup component add llvm-tools
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - if: runner.os == 'Windows' && env.SKIP != 'true'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.150
          fallback: none
      # Timing-bounded tests (1 s and 5 s durable-write and retirement budgets) fail closed when the
      # runner is contended: each Windows runner runs its half serially, Linux on two threads.
      # Temporary files stay on the workspace drive: a durable write's median was 6 to 9 ms on the
      # Windows system drive and 0.2 to 0.6 ms there (3 runners, 30 October 2026). The crate has no
      # doc tests, so nextest runs every test cargo test did.
      - if: runner.os == 'Windows' && env.SKIP != 'true'
        run: cargo nextest run --locked --no-fail-fast --partition hash:${{ matrix.shard }}/2 --test-threads=1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - if: runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'ARM64')
        run: cargo test --locked -- --test-threads=2
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # The x86_64 Linux leg runs the same tests under cargo-llvm-cov for the Codecov report.
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo llvm-cov --locked --lcov --output-path coverage-rust.lcov -- --test-threads=2
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.lcov
          retention-days: 1

  # This fixture test is #[ignore]d only because it needs an installed Chrome. It drives
  # intercepted, offline DOM fixtures in headless Chrome, which the runner image has.
  native-chrome:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked native_temporary_chat_predicate_and_retained_send_guard -- --ignored

  # The same test on macOS, whose Chrome launch, process identity and profile ownership checks
  # are its own code.
  native-chrome-macos:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked native_temporary_chat_predicate_and_retained_send_guard -- --ignored

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. A Codecov outage fails only this job.
  codecov:
    name: upload coverage to Codecov
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-rust
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust.lcov
          disable_search: true
          fail_ci_if_error: true
