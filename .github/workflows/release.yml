name: release

# Builds alcuin and alcuin-mcp for Linux and Windows and bundles alcuin-mcp as an MCP bundle
# (.mcpb) for Claude Desktop. A tag such as v0.1.0 attests the archives and publishes them as a
# GitHub release and then lists the bundle on the MCP Registry; a manual run attests and uploads
# artefacts; a pull request that changes this workflow, the bundle manifest or server.json only
# uploads them. The tests run in ci.yml on every commit to main, so this workflow only builds.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/mcpb/manifest.json
      - packaging/smoke.sh
      - server.json
  workflow_dispatch:

permissions:
  contents: read

# The MCP Registry's publisher CLI and the SHA-256 of its Linux archive (from the release's
# checksums file), shared by the bundle and registry jobs.
env:
  PUBLISHER_VERSION: v1.8.9
  PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Pinned, not ubuntu-latest, so the glibc floor (2.39) stays where README states it.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          }
      - run: rustup toolchain install
      - name: Build
        env:
          # A static C runtime, so the Windows binaries run without the VC++ redistributable.
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=alcuin-${{ matrix.target }}
          mkdir -p "dist/$name"
          for bin in alcuin alcuin-mcp; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.exe }}" "dist/$name/"
          done
          cp LICENSE NOTICE README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -r "$name"
      - name: Smoke-test the packaged archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          name=alcuin-${{ matrix.target }}
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && sha256sum -c "$name.zip.sha256")
            7z x "dist/$name.zip" -o"$smoke" > /dev/null
          else
            (cd dist && sha256sum -c "$name.tar.gz.sha256")
            tar -xzf "dist/$name.tar.gz" -C "$smoke"
          fi
          bash packaging/smoke.sh "$smoke/$name" "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alcuin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Bundle alcuin-mcp for Claude Desktop
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle/server" "$RUNNER_TEMP/out"
          tar -xzf dist/alcuin-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP"
          unzip -q dist/alcuin-x86_64-pc-windows-msvc.zip -d "$RUNNER_TEMP"
          # alcuin-mcp starts the alcuin CLI beside it, so each platform folder holds both.
          mv "$RUNNER_TEMP/alcuin-x86_64-unknown-linux-gnu" "$bundle/server/linux-x64"
          mv "$RUNNER_TEMP/alcuin-x86_64-pc-windows-msvc" "$bundle/server/win32-x64"
          for bin in alcuin alcuin-mcp; do
            test -x "$bundle/server/linux-x64/$bin"
            test -f "$bundle/server/win32-x64/$bin.exe"
          done
          sed "s/@VERSION@/${version}/" packaging/mcpb/manifest.json > "$bundle/manifest.json"
          python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$bundle/manifest.json"
          grep -q "\"version\": \"${version}\"" "$bundle/manifest.json"
          (cd "$bundle" && zip -qr "$RUNNER_TEMP/out/alcuin.mcpb" .)
          (cd "$RUNNER_TEMP/out" && sha256sum alcuin.mcpb > alcuin.mcpb.sha256)
      # The Linux server runs here; the Windows one must match the archive the build job ran.
      - name: Smoke-test the MCP bundle
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          smoke="$RUNNER_TEMP/mcpb-smoke"
          (cd "$RUNNER_TEMP/out" && sha256sum -c alcuin.mcpb.sha256)
          unzip -q "$RUNNER_TEMP/out/alcuin.mcpb" -d "$smoke"
          linux=$(jq -r .server.entry_point "$smoke/manifest.json")
          # The Windows command is ${__dirname}/<path>; drop that first segment.
          windows=$(jq -r .server.mcp_config.platform_overrides.win32.command "$smoke/manifest.json")
          windows=${windows#*/}
          bash packaging/smoke.sh "$smoke/$(dirname "$linux")" "$version"
          for bin in alcuin.exe alcuin-mcp.exe; do
            unzip -p dist/alcuin-x86_64-pc-windows-msvc.zip "alcuin-x86_64-pc-windows-msvc/$bin" |
              cmp - "$smoke/$(dirname "$windows")/$bin"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alcuin-mcpb
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
      # server.json holds the MCP Registry listing; its version, bundle URL and SHA-256 are set
      # here from Cargo.toml and the bundle just built, so every run checks what a tag publishes.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Write and validate the registry listing
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/out/alcuin.mcpb.sha256")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/alcuin.mcpb"
          mkdir -p "$RUNNER_TEMP/registry"
          jq --arg v "$version" --arg u "$url" --arg s "$sha" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' \
            server.json > "$RUNNER_TEMP/registry/server.json"
          "$RUNNER_TEMP/mcp-publisher" validate "$RUNNER_TEMP/registry/server.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-listing
          path: ${{ runner.temp }}/registry/server.json
          if-no-files-found: error

  # Attestations go to the public Sigstore log, so pull request runs skip this job.
  attest:
    if: github.event_name != 'pull_request'
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: alcuin-*
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb

  release:
    # A tag push only: a manual run on a tag leaves its artefacts unpublished.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, bundle, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: alcuin-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Prebuilt alcuin and alcuin-mcp for Linux (x86_64, glibc 2.39 or later) and Windows (x86_64), each archive with a SHA-256 checksum and a build provenance attestation, and an MCP bundle (alcuin.mcpb) for Claude Desktop. See CHANGELOG.md for what changed."

  # Lists the release on the MCP Registry. GitHub OIDC proves the io.github.yungSNAT namespace,
  # so no registry secret is stored. It runs after the release job, so the bundle URL resolves.
  registry:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [bundle, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-listing
          path: registry
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish the listing
        run: |
          set -euo pipefail
          test "$(jq -r .version registry/server.json)" = "${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish registry/server.json
